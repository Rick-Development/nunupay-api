name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting Production Deployment..."
            cd /home/billway/nunupay-api
            git config --global --add safe.directory /home/billway/nunupay-api || true
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository in /home/billway/nunupay-api..."
              git init
              git remote add origin https://github.com/Rick-Development/nunupay-api.git || git remote set-url origin https://github.com/Rick-Development/nunupay-api.git
            fi
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "Production Deployment Completed Successfully!"

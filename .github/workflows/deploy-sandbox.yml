name: Deploy Sandbox

on:
  push:
    branches:
      - sandbox

jobs:
  deploy:
    name: Deploy to Sandbox Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting Sandbox Deployment..."
            cd /home/billway/nunupay-sandbox
            git config --global --add safe.directory /home/billway/nunupay-sandbox || true
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository in /home/billway/nunupay-sandbox..."
              git init
              git remote add origin https://github.com/Rick-Development/nunupay-api.git || git remote set-url origin https://github.com/Rick-Development/nunupay-api.git
            fi
            git fetch origin sandbox
            git checkout -f -B sandbox origin/sandbox
            git reset --hard origin/sandbox
            rm -f bootstrap/cache/*.php
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts
            php artisan package:discover --ansi
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "Sandbox Deployment Completed Successfully!"
